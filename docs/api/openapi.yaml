openapi: 3.0.3
info:
  title: HE ERP V1 API (Next.js frontend)
  version: 0.1.0
  description: |
    Additive JSON API for the Next.js frontend. Every response uses the envelope
    `{ success, message, data, meta:{page,per_page,total}|null, errors|null }`.
    Auth: `Authorization: Bearer <token>` from POST /auth/login.
    Context headers (optional, validated against what the user may access):
    `X-Institute-Id`, `X-Academic-Year`, `X-Term-Id`.
servers:
  - url: http://localhost:8000/api/v1
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    InstituteId: { name: X-Institute-Id, in: header, schema: { type: integer }, description: Institute to work in (client admins may switch) }
    AcademicYear: { name: X-Academic-Year, in: header, schema: { type: string }, description: syear; defaults to the year containing today }
    TermId: { name: X-Term-Id, in: header, schema: { type: integer } }
  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { nullable: true }
        meta: { type: object, nullable: true, properties: { page: { type: integer }, per_page: { type: integer }, total: { type: integer } } }
        errors: { type: object, nullable: true, additionalProperties: { type: array, items: { type: string } } }
    Permissions:
      type: object
      properties: { view: { type: boolean }, add: { type: boolean }, edit: { type: boolean }, delete: { type: boolean } }
    MenuNode:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        link: { type: string, nullable: true, description: Laravel route name (tblmenumaster.link) }
        path: { type: string, nullable: true, description: Blade URL path of that route, e.g. /fees/fees_collect }
        icon: { type: string, nullable: true }
        level: { type: integer, enum: [1, 2, 3] }
        sort_order: { type: integer }
        permissions: { $ref: '#/components/schemas/Permissions' }
        children: { type: array, items: { $ref: '#/components/schemas/MenuNode' } }
paths:
  /auth/login:
    post:
      summary: Login (tbluser, then tblstudent as in the Blade login)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } }
      responses:
        '200': { description: "data: token, user, context, institutes, academic_years, terms, menu" }
        '401': { description: Invalid User Id And Password }
        '403': { description: No institute / Academic Term Date Expired / Please Contact Administrator For ERP Rights }
        '422': { description: Validation failed (errors keyed by field) }
  /auth/logout:
    post: { summary: Logout (stateless token; client discards it), security: [{ bearer: [] }], responses: { '200': { description: ok } } }
  /auth/me:
    get:
      summary: Current user, resolved context, institutes, academic years, terms, menu tree and setup_menu (MASTER-type screens) and access (flat list of screens with rights, independent of parent headings)
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/InstituteId'
        - $ref: '#/components/parameters/AcademicYear'
        - $ref: '#/components/parameters/TermId'
      responses:
        '200': { description: ok }
        '401': { description: Unauthenticated / expired token }
        '403': { description: Institute not allowed for this user }
  /auth/menu:
    get:
      summary: Sidebar tree (3 levels) with per-node permissions; individual rights override group rights
      security: [{ bearer: [] }]
      responses:
        '200':
          description: data is an array of MenuNode
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/MenuNode' } } } } } }
  /dashboard:
    get:
      summary: Dashboard counters and academic-year progress for the current institute / year (more widgets in later iterations)
      security: [{ bearer: [] }]
      responses:
        '200':
          description: |
            data.counters: [{key,label,value,hint}] for students (current-year enrolments), staff, classes (current term);
            data.academic_year: {syear,start_date,end_date,progress 0-100,days_left} or null
  /labels:
    get:
      summary: UI wording for the current institute (default strings overridden by the institute's active rows)
      security: [{ bearer: [] }]
      responses: { '200': { description: "data: { standard: Semester, division: Division, ... }" } }
  /school-setup/academic-sections:
    get: { summary: List academic sections (Academy), security: [{ bearer: [] }], description: "Right: view on subject_master.index. Query: page, per_page, search, sort", responses: { '200': { description: paginated } } }
    post: { summary: Create an academic section (title unique per institute), security: [{ bearer: [] }], description: "Right: add. Body: title*, short_name, sort_order, shift, medium", responses: { '201': { description: created }, '422': { description: validation or duplicate } } }
  /school-setup/standards:
    get: { summary: List standards (current term; filters[grade_id]; filters[all_terms]=1), security: [{ bearer: [] }], responses: { '200': { description: paginated } } }
    post: { summary: Create a standard in the current term, security: [{ bearer: [] }], description: "Body: name*, grade_id, short_name, sort_order, medium, course_duration, next_grade_id, next_standard_id", responses: { '201': { description: created } } }
  /school-setup/divisions:
    get: { summary: List divisions, security: [{ bearer: [] }], responses: { '200': { description: paginated } } }
    post: { summary: Create a division (name unique per institute), security: [{ bearer: [] }], responses: { '201': { description: created }, '422': { description: Division Already Exists } } }
  /school-setup/subjects:
    get: { summary: List subjects (current term; filters[standard_id]), security: [{ bearer: [] }], responses: { '200': { description: paginated } } }
    post: { summary: Create a subject (name unique per standard, case-insensitive), security: [{ bearer: [] }], description: "Body: standard_id*, subject_name*, subject_code, short_name, major", responses: { '201': { description: created }, '422': { description: validation or duplicate } } }
  /school-setup/subjects/{id}:
    put: { summary: Update a subject (right edit), security: [{ bearer: [] }], responses: { '200': { description: updated }, '404': { description: not in this institute } } }
    delete: { summary: Delete a subject (right delete), security: [{ bearer: [] }], responses: { '200': { description: deleted } } }
